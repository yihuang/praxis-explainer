name: CI

on:
  push:
    branches-ignore: [main]     # main is covered by pages.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Smoke-test both explainers
        run: node scripts/verify.mjs
